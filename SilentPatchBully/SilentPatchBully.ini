[SilentPatch]
; ================================ Frame rate ================================
; The game runs at a fixed 60 FPS. Scripts known to misbehave above 30 FPS temporarily lower the cap to
; ScriptFPSLimit while they run, and 60 FPS is restored when they end. Comma separated script names without
; extension, up to 32. The defaults are all classes and the missions known to break at 60 FPS: Weed Killer (2_08),
; Balls of Snow (3_01A), Nutcrackin' (3_01C), Finding Johnny Vincent (5_03), The Gym Is Burning (5_04).
; Area scripts can be listed too (e.g. Bdorm for the boys' dorm). Leave the list empty to disable.
ScriptFPSLimit=30
ScriptFPSLimitScripts=ClassArt,ClassBiology,ClassChem,ClassEnglish,ClassGeography,ClassMath,ClassMusic,ClassPhoto,ClassShop,2_08,3_01A,3_01C,5_03,5_04

; EXPERIMENTAL - sleep instead of spinning while waiting for the next frame, which frees up the CPU core the
; frame limiter would otherwise keep fully busy. Frame pacing may be marginally less precise, especially on
; Windows versions older than Windows 10 version 1803. 0 = spin (default, most precise), 1 = sleep.
FrameLimiterSleep=0

; ================================= Display ==================================
; Tell Windows the game renders at real pixels. Bully does not say so itself, so on a display scaled above 100%
; Windows renders it to a smaller virtual desktop and magnifies the result - on a 3840x2160 screen at 150% the
; game only sees 2560x1440, and picking anything larger pushes the frame past the screen edges, leaving just the
; oversized top left corner visible. 1 = declare DPI awareness (default), 0 = leave Windows scaling the game.
HighDPIAware=1

; Run in a borderless window covering the whole screen instead of exclusive fullscreen - the display mode is never
; changed, alt-tabbing is instant and the game stays visible when it loses focus. The game still renders at its own
; resolution and the frame is scaled to the screen, so pick the screen's own resolution for the sharpest picture.
; 1 = borderless, 0 = exclusive fullscreen (default).
Borderless=0

; ============================== Game settings ===============================
; These are written to the game's own settings in the registry
; (HKEY_CURRENT_USER\Software\Rockstar Games\Bully Scholarship Edition\A0) whenever a value here changes,
; so settings changed afterwards in the game's options menu are left alone. Set AlwaysApplySettings=1 to write
; them on every launch instead. Put a ; in front of a line to leave that setting untouched.
ResolutionWidth=1920
ResolutionHeight=1080

; Shadow quality, 0 (lowest) to 3 (highest)
ShadowLevel=3

; Anti-aliasing: 0 = off, 2 = 2x MSAA, 4 = 4x MSAA, 8 = 8x MSAA
;AntiAliasing=4

; Vertical sync: 0 = off, 1 = on
;Vsync=1

; 0 = fullscreen, 1 = windowed
;Windowed=0

AlwaysApplySettings=0

; Controller support in the game's ControllerSettings file (Documents\Bully Scholarship Edition).
; 1 = enable controllers, 0 = disable. Put a ; in front of the line to leave the file untouched.
;EnableControllers=1

; ================================ Diagnostics ===============================
; Write SilentPatchBully.log next to this file with what was detected and applied. Enable it when reporting issues.
LogFile=0

; ================================== Legacy ==================================
; Replace the game's memory manager with the CRT one, like the GTA SilentPatches do.
; Disabled by default, to be removed in the future.
CustomMemoryMgr=0
