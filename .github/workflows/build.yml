name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Release, Master ]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - name: Build ${{ matrix.configuration }}
        run: msbuild SilentPatchBully.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x86

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilentPatchBully-${{ matrix.configuration }}
          path: |
            ${{ matrix.configuration }}/SilentPatchBully.asi
            ${{ matrix.configuration }}/SilentPatchBully.ini
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: SilentPatchBully-Master
          path: dist

      - name: Read version from versionmeta.props
        id: version
        run: |
          rev=$(sed -n 's/.*<SILENTPATCH_REVISION_ID>\([0-9]*\)<.*/\1/p' SilentPatchBully/versionmeta.props)
          build=$(sed -n 's/.*<SILENTPATCH_BUILD_ID>\([0-9]*\)<.*/\1/p' SilentPatchBully/versionmeta.props)
          echo "tag=build-${rev}.${build}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "title=Build ${rev}.${build} (${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"

      - name: Fetch bundled third-party components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v9.7.4 --repo ThirteenAG/Ultimate-ASI-Loader --pattern Ultimate-ASI-Loader-NoPDB.zip --dir thirdparty
          gh release download v1.0 --repo CookiePLMonster/MiniDumper --pattern MiniDumper.zip --dir thirdparty
          cd thirdparty
          sha256sum --check <<'SUMS'
          14b3a1ad018899571ac9aa01482977f3c6d49e6cba99f552d01c5acacd1315e1  Ultimate-ASI-Loader-NoPDB.zip
          156661320bfa9a080d3d7d099da8e1f5db9e0ca6a854f3ef500ab96579ed52a3  MiniDumper.zip
          SUMS
          unzip -j Ultimate-ASI-Loader-NoPDB.zip dinput8.dll -d ../dist
          unzip -j MiniDumper.zip MiniDumper.asi -d ../dist

      - name: Package
        run: |
          cp SilentPatchBully/ReadMe.txt dist/
          cd dist && zip SilentPatchBully.zip SilentPatchBully.asi SilentPatchBully.ini ReadMe.txt dinput8.dll MiniDumper.asi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/SilentPatchBully.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.title }}" \
            --generate-notes
