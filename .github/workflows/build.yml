name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [ Release, Master ]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - name: Build ${{ matrix.configuration }}
        run: msbuild SilentPatchBully.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x86

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilentPatchBully-${{ matrix.configuration }}
          path: |
            ${{ matrix.configuration }}/SilentPatchBully.asi
            ${{ matrix.configuration }}/SilentPatchBully.ini
          if-no-files-found: error
